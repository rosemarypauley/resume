# Site settings
title:"Jekyll Resume Template"
description:"A resume template for Jekyll and GitHub Pages sites."

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "false"
resume_name:                    "Rosemary Pauley"
resume_title:                   "Program Coordinator, GW Open Source Program Office"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "r.pauley@gwu.edu"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       "804-572-9846"
resume_contact_address:         "1232 Rabdwick Valley Court, Zebulon NC 27597"

resume_header_contact_info:     "1232 Rabdwick Valley Court, Zebulon NC 27597 • 804-572-9846 • r.pauley@gwu.edu"
display_header_contact_info:    "false"

resume_header_intro: "<p>Though originally from a background in librarianship and information sciences, I have joined George Washington University's Open Source Program Office as Program Coordinator. I am passionate about community, communication, access, and outreach. Through my work with GW's OSPO and Libraries, I hope to continue my career in communications and library support while making an impact on the lives of educators, students, and the public. </p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "yes"

# Decide which sections to use
# comment out to hide
resume_section_experience:      true
resume_section_education:       true
resume_section_projects:        true
resume_section_skills:          true
#resume_section_recognition:     false
#resume_section_links:           false
#resume_section_associations:    false
# resume_section_interests:       true

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            "https://github.com/rosemarypauley"
  resume_linkedin_url:          "https://www.linkedin.com/in/rosemary-pauley-6a240223a/"
  # resume_instagram_url:         "insert your Instagram URL here"
  #resume_website_url:           "insert here"
  resume_medium_url:            "https://medium.com/@rpauley_68889"
resume_print_social_links:      true

# Design settings
resume_theme:                   default

# Note: when editing locally, remember to restart
# your Jekyll server when you edit this file. Changes
# to _config.yml are only recognized when the server starts
